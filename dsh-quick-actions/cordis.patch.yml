# dsh bundle patch: inserts quick-actions into the profile's host layer stack.
# `config` is optional; recognized keys (a patch entry replaces the whole
# config, so restate every key you care about):
#
#   storePath:    pin the button JSON store. Default resolution (first non-empty
#                 wins): this key -> the path chosen in the plugin panel (kept in
#                 <profile dir>/dsh-quick-actions.settings.json) -> the running
#                 profile's dir -> $DSH_PROFILE_DIR -> ~/.dsh. Setting this key
#                 makes the panel show the path as fixed and hide its field.
#                 Absolute paths are recommended; a leading ~ is expanded.
#   workdir:      default working directory for commands that set none
#   buttons:      static button definitions, read-only in the UI panel
#   maxOutputChars: per-run output cap kept in memory (default 200000)
#   pollMs:       output pump interval (default 150)
#
# - insert:
#     - id: dsh-quick-actions
#       name: 'dsh-quick-actions'
#       config:
#         workdir: /Users/you/projects
#         buttons:
#           - id: status
#             label: Git status
#             command: git -C {workspace} status -sb
#             scope: workspace
- insert:
    - id: dsh-quick-actions
      name: 'dsh-quick-actions'
